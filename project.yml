# Run ./setup.sh to turn this into WorkoutApp.xcodeproj.
# Source folders are Xcode "synchronized folders", so new .swift files are
# picked up automatically and you only need to regenerate when this file changes.
name: WorkoutApp
options:
  bundleIdPrefix: io.github.tatumrae-t
  projectFormat: xcode16_0
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_PREVIEWS: YES
targets:
  WorkoutApp:
    type: application
    platform: iOS
    sources:
      - path: Shared
        type: syncedFolder
      - path: iOS
        type: syncedFolder
      - path: LiveActivity
        type: syncedFolder
    info:
      path: Config/iOS-Info.plist
      properties:
        CFBundleDisplayName: Workouts
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        # Keeps the app running through rest so the beep plays when locked.
        UIBackgroundModes: [audio]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.tatumrae-t.workout
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: WorkoutWatch
      - target: WorkoutWidgets
    scheme: {}

  # Rest timer Live Activity on the Lock Screen and in the Dynamic Island.
  WorkoutWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
        type: syncedFolder
      - path: LiveActivity
        type: syncedFolder
    info:
      path: Config/Widget-Info.plist
      properties:
        CFBundleDisplayName: Workouts
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.tatumrae-t.workout.widgets
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES

  WorkoutWatch:
    type: application
    platform: watchOS
    sources:
      - path: Shared
        type: syncedFolder
      - path: Watch
        type: syncedFolder
    info:
      path: Config/Watch-Info.plist
      properties:
        CFBundleDisplayName: Workouts
        WKApplication: true
        WKCompanionAppBundleIdentifier: io.github.tatumrae-t.workout
        WKRunsIndependentlyOfCompanionApp: false
        WKBackgroundModes: [workout-processing]
        NSHealthShareUsageDescription: Shows your heart rate and calories while you lift.
        NSHealthUpdateUsageDescription: Saves your lifting sessions to Apple Health so they count toward your rings.
    entitlements:
      path: Config/Watch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.tatumrae-t.workout.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
    scheme: {}
